name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # src/build.test.js builds the site and asserts the things that matter
      # once it is deployed: nothing fetched from the network at runtime, both
      # icons embedded, a valid manifest whose icons exist at the sizes they
      # claim, and a service worker that precaches what it says it does.
      - run: bun test

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # Let a running deploy finish rather than cancelling it half way.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun run build

      # The page, plus the manifest, service worker and icons that make it
      # installable. artifact.html is only for publishing elsewhere, so it is
      # kept out of the deployed site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          rm -f _site/artifact.html
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

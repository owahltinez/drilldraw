name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build

      # The page must stay openable offline from a phone, so fail the build if
      # anything sneaks in that would need the network at runtime.
      - name: Check the page is self-contained
        run: |
          if grep -Eq '(src|href)="(https?:)?//' dist/index.html; then
            echo "dist/index.html references an external URL:"
            grep -Eo '(src|href)="(https?:)?//[^"]*"' dist/index.html
            exit 1
          fi

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # Let a running deploy finish rather than cancelling it half way.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun run build

      # The whole site is the one self-contained file; artifact.html is only for
      # publishing elsewhere and is deliberately left out.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
